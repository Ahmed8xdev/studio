name: Contact form recovery tests

on:
  pull_request:
    paths: ['src/lib/contact-flow.ts', 'src/components/contact-section.tsx', 'tests/**', '.github/workflows/contact-tests.yml']
  push:
    branches: [master]
    paths: ['src/lib/contact-flow.ts', 'src/components/contact-section.tsx', 'tests/**', '.github/workflows/contact-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/*.test.cjs
